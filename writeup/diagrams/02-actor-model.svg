<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Actor model: three agents exchange messages with each other and never read each other's memory. Each agent reads and writes only its own rows in one shared agent_memory table, selected by WHERE agent_id. One vector index covers all agents' rows, so every filtered query walks the shared graph.">
          <defs>
            <marker id="act-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="act-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>
<style>
  :root { --fg: #14232b; --muted: #55666f; --bg: #f6f8f9; --panel: #eaf0f2; --panel-line: #b9c7cd; --accent: #0a6f86; --accent-soft: #d6ecf1; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e3ecef; --muted: #93a6ae; --bg: #0c1519; --panel: #13232a; --panel-line: #34505a; --accent: #4fc3dc; --accent-soft: #0f2f38; } }
  svg { color: var(--fg); background: var(--bg); }
  text { fill: currentColor; font: 12px "Public Sans", "Helvetica Neue", Arial, sans-serif; }
  .mono { font-family: "JetBrains Mono", Menlo, monospace; font-size: 11.5px; }
  .t { font-weight: 600; font-size: 13px; } .sm { font-size: 11px; }
  .mut { fill: var(--muted); } .acct { fill: var(--accent); }
  .box { fill: var(--panel); stroke: var(--panel-line); } .plain { fill: var(--bg); stroke: var(--panel-line); }
  .accbox { fill: var(--accent-soft); stroke: var(--accent); } .frame { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
  .ln { fill: none; stroke: currentColor; stroke-width: 1.3; } .ret { stroke-dasharray: 5 4; } .acc { stroke: var(--accent); stroke-width: 1.8; }
  .life { stroke: var(--muted); stroke-dasharray: 2 4; } .band { fill: var(--panel); opacity: 0.55; }
  .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .mk { fill: currentColor; } .mkacc { fill: var(--accent); }
</style>
          <rect class="box" x="20" y="40" width="170" height="60" rx="6"/>
          <text class="t" x="105" y="66" text-anchor="middle">billing-agent</text>
          <text class="sm mut" x="105" y="84" text-anchor="middle">actor · own state</text>
          <rect class="box" x="20" y="140" width="170" height="60" rx="6"/>
          <text class="t" x="105" y="166" text-anchor="middle">support-agent</text>
          <text class="sm mut" x="105" y="184" text-anchor="middle">actor · own state</text>
          <rect class="box" x="20" y="240" width="170" height="60" rx="6"/>
          <text class="t" x="105" y="266" text-anchor="middle">claude-code</text>
          <text class="sm mut" x="105" y="284" text-anchor="middle">actor · own state</text>
          <line class="ln ret" x1="60" y1="100" x2="60" y2="138" marker-start="url(#act-a)" marker-end="url(#act-a)"/>
          <text class="sm halo" x="68" y="124">message</text>
          <line class="ln ret" x1="60" y1="200" x2="60" y2="238" marker-start="url(#act-a)" marker-end="url(#act-a)"/>
          <text class="sm halo" x="68" y="224">message</text>

          <rect class="frame" x="400" y="20" width="340" height="294" rx="8"/>
          <text class="t" x="570" y="42" text-anchor="middle">MariaDB · one agent_memory table</text>
          <rect class="plain" x="420" y="58" width="300" height="56" rx="4"/>
          <text class="mono" x="432" y="82">agent_id = 'billing-agent'</text>
          <text class="sm mut" x="432" y="100">its notes and vectors</text>
          <rect class="plain" x="420" y="126" width="300" height="56" rx="4"/>
          <text class="mono" x="432" y="150">agent_id = 'support-agent'</text>
          <text class="sm mut" x="432" y="168">its notes and vectors</text>
          <rect class="plain" x="420" y="194" width="300" height="56" rx="4"/>
          <text class="mono" x="432" y="218">agent_id = 'claude-code'</text>
          <text class="sm mut" x="432" y="236">its notes and vectors</text>
          <rect class="accbox" x="420" y="266" width="300" height="34" rx="4"/>
          <text class="sm acct t" x="570" y="288" text-anchor="middle">one VECTOR INDEX over every agent's rows</text>

          <line class="ln" x1="190" y1="70" x2="418" y2="86" marker-end="url(#act-a)"/>
          <text class="sm mono halo" x="300" y="68" text-anchor="middle">WHERE agent_id = ?</text>
          <line class="ln" x1="190" y1="170" x2="418" y2="154" marker-end="url(#act-a)"/>
          <line class="ln" x1="190" y1="270" x2="418" y2="222" marker-end="url(#act-a)"/>
          <text class="sm halo" x="300" y="268" text-anchor="middle">recall and remember</text>
        </svg>
